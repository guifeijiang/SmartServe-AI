services:
  # Redis Stack：提供 RediSearch（向量索引 FT.CREATE / FT.SEARCH KNN）
  # 启动：docker compose up -d redis-stack
  # 校验：docker exec -it knowflow-redis-stack redis-cli MODULE LIST
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: knowflow-redis-stack
    ports:
      - "6379:6379"
    volumes:
      - redis-stack-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-stack-data:
