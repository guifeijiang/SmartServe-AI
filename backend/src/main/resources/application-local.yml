# Activate with: --spring.profiles.active=local
# JDBC URL database name is fixed to knowflow_ai (not overridable).
spring:
  datasource:
    url: jdbc:mysql://${KNOWFLOW_DB_HOST:127.0.0.1}:${KNOWFLOW_DB_PORT:3306}/knowflow_ai?characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${KNOWFLOW_DB_USERNAME}
    password: ${KNOWFLOW_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
knowflow:
  rocketmq:
    enabled: true
    consumer-enabled: true
    outbox-dispatch-enabled: true
    name-server: ${KNOWFLOW_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: ${KNOWFLOW_ROCKETMQ_PRODUCER_GROUP:knowflow-ticket-producer}
    consumer-group: ${KNOWFLOW_ROCKETMQ_CONSUMER_GROUP:knowflow-ticket-consumer}
    topic: ${KNOWFLOW_ROCKETMQ_TOPIC:TICKET_CREATED}
    tag: ${KNOWFLOW_ROCKETMQ_TAG:CREATED}
